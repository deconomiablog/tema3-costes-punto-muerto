<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Práctica interactiva del Tema 3 de Economía de 1.º de Bachillerato: costes, beneficios y umbral de rentabilidad.">
  <title>Tema 3 · Costes y punto muerto | D'economíaBlog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-home>
      <span class="brand-mark">ECO</span>
      <span><strong>Tema 3</strong><small>Costes y punto muerto</small></span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="calcToggle" type="button" aria-label="Abrir calculadora">🧮 <span>Calculadora</span></button>
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Ir al inicio">⌂ <span>Inicio</span></button>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <aside id="calculator" class="calculator" aria-hidden="true">
    <div class="calc-head">
      <strong>Calculadora</strong>
      <button id="calcClose" type="button" aria-label="Cerrar calculadora">×</button>
    </div>
    <input id="calcDisplay" inputmode="decimal" autocomplete="off" aria-label="Pantalla de calculadora">
    <div class="calc-grid">
      <button type="button" data-calc="C" class="muted">C</button><button type="button" data-calc="(">(</button><button type="button" data-calc=")">)</button><button type="button" data-calc="/" class="op">÷</button>
      <button type="button" data-calc="7">7</button><button type="button" data-calc="8">8</button><button type="button" data-calc="9">9</button><button type="button" data-calc="*" class="op">×</button>
      <button type="button" data-calc="4">4</button><button type="button" data-calc="5">5</button><button type="button" data-calc="6">6</button><button type="button" data-calc="-" class="op">−</button>
      <button type="button" data-calc="1">1</button><button type="button" data-calc="2">2</button><button type="button" data-calc="3">3</button><button type="button" data-calc="+" class="op">+</button>
      <button type="button" data-calc="0">0</button><button type="button" data-calc=".">,</button><button type="button" data-calc="⌫">⌫</button><button type="button" data-calc="=" class="equals">=</button>
    </div>
    <p class="calc-note">Puedes usarla durante toda la práctica. No penaliza la puntuación.</p>
  </aside>

  <footer>
    <span>Economía · 1.º Bachillerato</span>
    <span>D'economíaBlog</span>
  </footer>

  <script src="question-helpers.js"></script>
  <script src="costs.js"></script>
  <script src="point.js"></script>
  <script src="app.js"></script>
</body>
</html>
